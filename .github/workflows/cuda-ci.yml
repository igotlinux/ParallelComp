name: KernelGuard CUDA & PTX Verification

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/kernels/cuda/**'
      - 'python/kernelguard/toolchains/cuda.py'
      - 'python/kernelguard/analysis/ptx_parser.py'

jobs:
  cuda-ptx-verification:
    name: CUDA to PTX Inspection
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.3.1-devel-ubuntu22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y cmake ninja-build python3 python3-pip git build-essential
          pip3 install pyyaml .

      - name: Verify NVCC Toolchain
        run: |
          nvcc --version

      - name: Build C++ and CUDA Targets
        run: |
          cmake -B build -G Ninja
          cmake --build build

      - name: Run PTX Unit Tests
        run: |
          PYTHONPATH=python python3 -m unittest discover -s tests -v

      - name: Run CUDA PTX Verification Matrix
        run: |
          ./kg run --backend cuda --profile quick

      - name: Upload PTX Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-ptx-reports
          path: reports/
