services:
  - type: web
    name: kernelguard-saas-server
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: python3 -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: ./python:.
      - key: KG_ADMIN_API_KEY
        generateValue: true
      - key: KG_MASTER_SIGNING_KEY
        generateValue: true
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
